[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.84999999999999998
    capsule = true
    capsule_padding = 8.0
    capsule_radius = 6
    center = [ "cpu", "ram", "temp" ]
    end = [ "audio_visualizer", "tray", "privacy", "group:g1", "volume", "battery", "group:g2", "notifications", "session" ]
    font_scale = 0.95999999999999996
    margin_ends = 0
    padding = 15
    position = "left"
    scale = 1.1000000000000001
    start = [ "control-center", "bar", "workspaces" ]
    thickness = 50
    widget_spacing = 7

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "clipboard", "network", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "clock", "date" ]
        opacity = 1.0
        padding = 12.0

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[brightness]
enable_scheduled_brightness = true
scheduled_night_brightness = 0.48999999999999999

[control_center]
width = 900

[dock]
background_opacity = 0.84999999999999998

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1920.0
    cy = 1978.0
    output = "DP-1"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.84999999999999998
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
background_opacity = 0.84999999999999998

[osd]
background_opacity = 0.84999999999999998
position = "bottom_center"
position_vertical = "bottom_center"

[plugin_settings."aabidk20/yt-music"]
mini_placement = "attached"

[plugins]
enabled = [ "noctalia/notes", "noctalia/umbriel-companion", "aabidk20/yt-music" ]

[shell]
font_family = "Geist"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
time_format = "{:%p %H:%M}"
umbriel_audio_provider_enabled = true
umbriel_overview_close_on_launch_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.launcher]
    compact = true
    layout = "simple"

    [shell.panel]
    launcher_placement = "attached"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "umbriel" ]
    community_ids = [ "zen-browser", "lazyvim", "bat", "fzf", "lazygit", "starship", "yazi" ]

[wallpaper]
directory = "/home/sorrel/Pictures/Wallpapers"
fill_mode = "center"

    [wallpaper.default]
    path = "/home/sorrel/Pictures/Wallpapers/your-name.jpg"

    [wallpaper.last]
    path = "/home/sorrel/Pictures/Wallpapers/your-name.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/sorrel/Pictures/Wallpapers/your-name.jpg"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.ram]
stat = "ram_pct"

[widget.temp]
stat = "gpu_temp"

[widget.workspaces]
font_scale = 1.3999999999999999
style = "minimal"
