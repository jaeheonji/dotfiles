[dotfile_groups.yazi]
root = "config/yazi"
target = "~/.config/yazi"
mode = "symlink-each"
exclude = ["/theme.toml", "/package.toml"]

[dotfiles]
"~/.config/yazi/theme.toml" = { source = "../../config/yazi/theme.toml", mode = "symlink" }
"~/.config/yazi/package.toml" = { source = "../../config/yazi/package.toml", mode = "symlink" }

[bootstrap.packages]
yazi = "latest"

[bootstrap.hooks]
post-dotfiles = "ya pkg install"
