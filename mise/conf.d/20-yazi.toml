[bootstrap.packages]
"pacman:yazi" = "latest"
"pacman:ouch" = "latest"
"brew:yazi" = { os = "macos" }
"brew:ouch" = { os = "macos" }

[bootstrap.hooks]
post-dotfiles = "ya pkg install"

[dotfile_groups.yazi]
root = "config/yazi"
target = "~/.config/yazi"
mode = "symlink-each"
exclude = ["/theme.toml", "/package.toml"]

[dotfiles]
"~/.config/yazi/theme.toml/shared" = { source = "../../config/yazi/theme.toml", merge = true }
"~/.config/yazi/package.toml/shared" = { source = "../../config/yazi/package.toml", merge = true }
